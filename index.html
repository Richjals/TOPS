<script>
  // POLYFILL: Otomatis mengubah semua google.script.run menjadi fetch() untuk GitHub Pages
  (function() {
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNGmxtdvON6McOPeRxc4O5QEgbc02fEI5hrKLPt5jHymLK_dccljq2gtQPpL13_e2e/exec";

    if (typeof window.google === "undefined" || !window.google.script) {
      function createRunner(successHandler, failureHandler) {
        return new Proxy({}, {
          get: function(_, prop) {
            if (prop === "withSuccessHandler") {
              return function(fn) { return createRunner(fn, failureHandler); };
            }
            if (prop === "withFailureHandler") {
              return function(fn) { return createRunner(successHandler, fn); };
            }
            if (prop === "withUserObject") {
              return function() { return createRunner(successHandler, failureHandler); };
            }
            // Saat fungsi seperti .login(...) atau .saveDaily(...) dipanggil:
            return function(...args) {
              fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: prop, args: args })
              })
              .then(function(res) { return res.json(); })
              .then(function(data) {
                if (data && data.__rpc_ok) {
                  if (typeof successHandler === "function") successHandler(data.result);
                } else {
                  const err = new Error((data && data.error) || "Terjadi kesalahan pada server.");
                  if (typeof failureHandler === "function") failureHandler(err);
                  else console.error(err);
                }
              })
              .catch(function(err) {
                if (typeof failureHandler === "function") failureHandler(err);
                else console.error("Fetch Error:", err);
              });
            };
          }
        });
      }

      window.google = {
        script: {
          run: createRunner(null, null)
        }
      };
    }
  })();
</script>
